[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
cluster = { path = "../cluster" }
outbound = { path = "../outbound" }
inbound = { path = "../inbound" }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
