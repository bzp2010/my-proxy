[workspace]
resolver = "3"
members = [
    "crates/cluster",
    "crates/outbound",
    "crates/inbound",
    "crates/proxy",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cluster = { path = "crates/cluster" }
outbound = { path = "crates/outbound" }
inbound = { path = "crates/inbound" }
proxy = { path = "crates/proxy" }

tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
openssl = "0.10"
tokio-openssl = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio-test = "0.4"
tempfile = "3"
